name: alwaaalwazirlwazir
description: "Al-Wazir Chat - الفهد"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # اتصال قريب حقيقي بين الأجهزة
  nearby_connections: ^4.1.0

  # صلاحيات Bluetooth / Wi-Fi / الكاميرا / الميكروفون
  permission_handler: ^11.3.1

  # حفظ الإعدادات والبيانات الخفيفة محليًا
  shared_preferences: ^2.2.3

  # الكاميرا والمعرض
  image_picker: ^1.1.2

  # اختيار الملفات
  file_picker: ^8.0.0

  # تسجيل الصوت الحقيقي
  record: ^5.1.2

  # مسارات ملفات التسجيل والوسائط
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
