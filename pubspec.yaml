name: wchat_alwzeer_pro
description: "تطبيق واتساب الوزير احترافي للدردشة والمكالمات والصوتيات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- قواعد البيانات والتخزين المحلي ---
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # --- مكتبات الواجهات والملصقات والإيموجي ---
  cupertino_icons: ^1.0.8
  emoji_picker_flutter: ^2.1.0
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.0

  # --- التقاط الملفات والمستندات والوسائط ---
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # --- الصوتيات والتسجيل (محدثة لدعم Android v2 embedding) ---
  audioplayers: ^6.0.0
  record: ^5.1.2

  # --- حزم الاتصال والشبكات والـ API ---
  http: ^1.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مسارات الصور والأصول
  assets:
    - assets/images/
    - assets/icons/
